name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.2）"
        required: true
        type: string
      version_code:
        description: "versionCode（可留空，留空时使用构建脚本默认值）"
        required: false
        type: string
        default: ""
      release_body:
        description: "Release 说明（可留空）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 校验版本号
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::版本号必须为三段数字格式（如 0.1.2），实际输入：$VERSION"
            exit 1
          fi
          {
            echo "APP_VERSION_NAME=$VERSION"
            echo "RELEASE_TAG=$VERSION"
          } >> "$GITHUB_ENV"

      - name: 还原签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::仓库缺少签名 secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties

      - name: 打包 Release APK
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          ARGS="-PappVersionName=$APP_VERSION_NAME"
          if [ -n "$VERSION_CODE_INPUT" ]; then
            if ! [[ "$VERSION_CODE_INPUT" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE_INPUT" -gt 2100000000 ]; then
              echo "::error::versionCode 必须为不超过 2100000000 的整数，实际输入：$VERSION_CODE_INPUT"
              exit 1
            fi
            ARGS="$ARGS -PappVersionCode=$VERSION_CODE_INPUT"
          fi
          ./gradlew :app:assembleRelease $ARGS

      - name: 校验产物
        run: |
          APK_DIR="app/build/outputs/apk/release"
          for abi in arm64-v8a armeabi-v7a x86; do
            APK="$APK_DIR/good-tvplorer-release-$APP_VERSION_NAME-$abi.apk"
            if [ ! -f "$APK" ]; then
              echo "::error::缺少产物 $APK"
              exit 1
            fi
          done
          ls -l "$APK_DIR"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BODY: ${{ inputs.release_body }}
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if gh release view "$RELEASE_TAG" --json id > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在：覆盖同名附件，不修改标题与说明"
            gh release upload "$RELEASE_TAG" "$APK_DIR"/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$APP_VERSION_NAME" \
              --notes "$RELEASE_BODY" \
              "$APK_DIR"/*.apk
          fi
